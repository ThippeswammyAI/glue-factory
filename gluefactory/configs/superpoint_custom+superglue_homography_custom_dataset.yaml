data:
    name: homographies
    data_dir: output/sample_data
    image_dir: images
    image_list: custom_image_list.txt
    train_size: 15
    val_size: 4
    batch_size: 8
    num_workers: 8
    homography:
        difficulty: 0.9
        max_angle: 30
        patch_shape: [512, 208]
    photometric:
        name: lg
    load_features:
        do: True
        path: "output/sample_data/exports/custom_dataset_consensus_SP.h5"
        collate: False
        max_num_keypoints: 512
        force_num_keypoints: True
model:
    name: two_view_pipeline
    extractor:
        name: null
    allow_no_extract: True
    ground_truth:
        name: matchers.homography_matcher
        th_positive: 3
        th_negative: 3
    matcher:
        name: gluefactory_nonfree.superglue
        weights: outdoor
        filter_threshold: 0.05
        flash: false
        checkpointed: true
train:
    seed: 0
    epochs: 100
    log_every_iter: 1
    eval_every_iter: 10
    lr: 1e-4
    lr_schedule:
        start: 20
        type: exp
        on_epoch: true
        exp_div_10: 10
    plot: [1, 'gluefactory.visualization.visualize_batch.make_match_figures']
benchmarks:
    hpatches:
      eval:
        estimator: opencv
        ransac_th: 0.5
